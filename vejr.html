<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokalt Vejr</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .location {
            font-size: 24px;
            font-weight: bold;
            color: #444;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 72px;
            line-height: 1;
            margin: 0 auto 20px;
        }

        .temp {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .detail-item {
            background: #f5f7fa;
            border-radius: 10px;
            padding: 12px;
        }

        .detail-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: default;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 8px;
            vertical-align: -2px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #856404;
        }

        .hidden {
            display: none;
        }

        .time {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .source {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .source a {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lokalt Vejr</h1>
        <p class="subtitle">Se vejret for din nuværende position</p>

        <div id="error" class="error hidden" role="alert"></div>

        <div id="notice" class="notice">
            <strong>Første gang?</strong> Klik på "Få min position" for at tillade adgang til din placering,
            derefter hentes vejrdata automatisk.
        </div>

        <button id="getLocationBtn" class="btn" type="button">
            <span id="btnText">Få min position</span>
            <span id="loadingSpinner" class="loading hidden"></span>
        </button>

        <div id="weatherInfo" class="hidden">
            <div class="location" id="location">--</div>
            <div class="time" id="time"></div>
            <div class="weather-icon" id="weatherIcon" aria-hidden="true"></div>
            <div class="temp" id="temperature">--°C</div>
            <div class="description" id="description">--</div>
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">Føles som</div>
                    <div class="detail-value" id="feelsLike">--°C</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Fugtighed</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Vind</div>
                    <div class="detail-value" id="windSpeed">-- m/s</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Tryk</div>
                    <div class="detail-value" id="pressure">-- hPa</div>
                </div>
            </div>
        </div>

        <p class="source">Vejrdata fra <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (gratis, ingen API-nøgle)</p>
    </div>

    <script>
        'use strict';

        // Open-Meteo kræver ingen API-nøgle og tillader kald direkte fra browseren (CORS).
        const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
        const GEOCODE_URL = 'https://api.bigdatacloud.net/data/reverse-geocode-client';

        // Fallback hvis position ikke kan hentes: København.
        const FALLBACK = { lat: 55.6761, lon: 12.5683, label: 'København, DK' };

        const REQUEST_TIMEOUT_MS = 10000;

        const getLocationBtn = document.getElementById('getLocationBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const weatherInfo = document.getElementById('weatherInfo');
        const errorElement = document.getElementById('error');
        const noticeElement = document.getElementById('notice');

        const locationElement = document.getElementById('location');
        const timeElement = document.getElementById('time');
        const temperatureElement = document.getElementById('temperature');
        const descriptionElement = document.getElementById('description');
        const weatherIconElement = document.getElementById('weatherIcon');
        const feelsLikeElement = document.getElementById('feelsLike');
        const humidityElement = document.getElementById('humidity');
        const windSpeedElement = document.getElementById('windSpeed');
        const pressureElement = document.getElementById('pressure');

        let isLoading = false;

        // WMO weather codes -> dansk tekst og ikon.
        const WEATHER_CODES = {
            0:  { text: 'Klart vejr',                 day: '☀️', night: '🌙' },
            1:  { text: 'Overvejende klart',          day: '🌤️', night: '🌙' },
            2:  { text: 'Delvist skyet',              day: '⛅',  night: '☁️' },
            3:  { text: 'Overskyet',                  day: '☁️',  night: '☁️' },
            45: { text: 'Tåge',                       day: '🌫️', night: '🌫️' },
            48: { text: 'Rimtåge',                    day: '🌫️', night: '🌫️' },
            51: { text: 'Let støvregn',               day: '🌦️', night: '🌦️' },
            53: { text: 'Støvregn',                   day: '🌦️', night: '🌦️' },
            55: { text: 'Kraftig støvregn',           day: '🌧️', night: '🌧️' },
            56: { text: 'Underkølet støvregn',        day: '🌧️', night: '🌧️' },
            57: { text: 'Kraftig underkølet støvregn',day: '🌧️', night: '🌧️' },
            61: { text: 'Let regn',                   day: '🌦️', night: '🌦️' },
            63: { text: 'Regn',                       day: '🌧️', night: '🌧️' },
            65: { text: 'Kraftig regn',               day: '🌧️', night: '🌧️' },
            66: { text: 'Underkølet regn',            day: '🌧️', night: '🌧️' },
            67: { text: 'Kraftig underkølet regn',    day: '🌧️', night: '🌧️' },
            71: { text: 'Let snefald',                day: '🌨️', night: '🌨️' },
            73: { text: 'Snefald',                    day: '🌨️', night: '🌨️' },
            75: { text: 'Kraftigt snefald',           day: '❄️',  night: '❄️' },
            77: { text: 'Snekorn',                    day: '❄️',  night: '❄️' },
            80: { text: 'Lette regnbyger',            day: '🌦️', night: '🌦️' },
            81: { text: 'Regnbyger',                  day: '🌧️', night: '🌧️' },
            82: { text: 'Kraftige regnbyger',         day: '⛈️',  night: '⛈️' },
            85: { text: 'Lette snebyger',             day: '🌨️', night: '🌨️' },
            86: { text: 'Kraftige snebyger',          day: '🌨️', night: '🌨️' },
            95: { text: 'Tordenvejr',                 day: '⛈️',  night: '⛈️' },
            96: { text: 'Tordenvejr med let hagl',    day: '⛈️',  night: '⛈️' },
            99: { text: 'Tordenvejr med kraftig hagl',day: '⛈️',  night: '⛈️' }
        };

        // fetch med timeout, så en hængende forbindelse ikke låser knappen for evigt.
        async function fetchJson(url) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            try {
                const response = await fetch(url, { signal: controller.signal });
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return await response.json();
            } catch (error) {
                if (error.name === 'AbortError') {
                    throw new Error('Forbindelsen tog for lang tid (timeout).');
                }
                throw error;
            } finally {
                clearTimeout(timer);
            }
        }

        function setLoading(loading, label) {
            isLoading = loading;
            getLocationBtn.disabled = loading;
            loadingSpinner.classList.toggle('hidden', !loading);
            btnText.textContent = label;
        }

        function showError(message) {
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }

        function clearError() {
            errorElement.textContent = '';
            errorElement.classList.add('hidden');
        }

        function showNotice(message) {
            noticeElement.textContent = message;
            noticeElement.classList.remove('hidden');
        }

        // Hent brugerens position som et Promise, så flowet kan skrives med await.
        function getPosition() {
            return new Promise((resolve, reject) => {
                if (!window.isSecureContext) {
                    reject(new Error('Positionsdata kræver HTTPS. Åbn siden via https:// eller localhost, ikke som en lokal fil.'));
                    return;
                }
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation understøttes ikke af din browser.'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    position => resolve(position.coords),
                    error => reject(new Error(geolocationMessage(error))),
                    { enableHighAccuracy: false, timeout: REQUEST_TIMEOUT_MS, maximumAge: 300000 }
                );
            });
        }

        function geolocationMessage(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    return 'Adgang til position blev nægtet.';
                case error.POSITION_UNAVAILABLE:
                    return 'Positionen er ikke tilgængelig lige nu.';
                case error.TIMEOUT:
                    return 'Hentning af position tog for lang tid.';
                default:
                    return error.message || 'Ukendt fejl ved hentning af position.';
            }
        }

        // Bynavn via reverse geocoding. Fejler den, bruger vi koordinaterne i stedet.
        async function resolvePlaceName(lat, lon) {
            try {
                const data = await fetchJson(
                    GEOCODE_URL + '?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=da'
                );
                const city = data.city || data.locality || data.principalSubdivision;
                if (city) {
                    return data.countryCode ? city + ', ' + data.countryCode : city;
                }
            } catch (error) {
                // Bynavn er pynt, ikke data. Stilhed her, koordinater vises i stedet.
            }
            return lat.toFixed(2) + '°, ' + lon.toFixed(2) + '°';
        }

        async function fetchWeather(lat, lon) {
            const url = WEATHER_URL
                + '?latitude=' + lat
                + '&longitude=' + lon
                + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,surface_pressure,wind_speed_10m,weather_code,is_day'
                + '&wind_speed_unit=ms'
                + '&timezone=auto';

            const data = await fetchJson(url);
            if (!data || !data.current) {
                throw new Error('Uventet svar fra vejrtjenesten.');
            }
            return data.current;
        }

        function displayWeather(current, placeName) {
            const codeInfo = WEATHER_CODES[current.weather_code] || { text: 'Ukendt vejrtype', day: '❓', night: '❓' };

            locationElement.textContent = placeName;
            weatherIconElement.textContent = current.is_day ? codeInfo.day : codeInfo.night;
            descriptionElement.textContent = codeInfo.text;

            temperatureElement.textContent = Math.round(current.temperature_2m) + '°C';
            feelsLikeElement.textContent = Math.round(current.apparent_temperature) + '°C';
            humidityElement.textContent = Math.round(current.relative_humidity_2m) + '%';
            pressureElement.textContent = Math.round(current.surface_pressure) + ' hPa';

            const windMs = current.wind_speed_10m;
            windSpeedElement.textContent = windMs.toFixed(1) + ' m/s (' + Math.round(windMs * 3.6) + ' km/h)';

            const now = new Date();
            const timeString = now.toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' });
            timeElement.textContent = dateString + ' - ' + timeString;

            weatherInfo.classList.remove('hidden');
        }

        async function loadWeather() {
            if (isLoading) return;

            clearError();
            setLoading(true, 'Henter...');

            let lat, lon, placeName, positionProblem = null;

            try {
                const coords = await getPosition();
                lat = coords.latitude;
                lon = coords.longitude;
            } catch (error) {
                positionProblem = error.message;
                lat = FALLBACK.lat;
                lon = FALLBACK.lon;
            }

            try {
                const current = await fetchWeather(lat, lon);
                placeName = positionProblem ? FALLBACK.label : await resolvePlaceName(lat, lon);
                displayWeather(current, placeName);

                if (positionProblem) {
                    showNotice(positionProblem + ' Viser i stedet rigtige vejrdata for ' + FALLBACK.label + '.');
                } else {
                    noticeElement.classList.add('hidden');
                }
                setLoading(false, 'Opdater vejr');
            } catch (error) {
                weatherInfo.classList.add('hidden');
                showError('Kunne ikke hente vejrdata: ' + error.message);
                showNotice('Tjek din internetforbindelse og prøv igen.');
                setLoading(false, 'Prøv igen');
            }
        }

        getLocationBtn.addEventListener('click', loadWeather);

        // Har brugeren allerede givet tilladelse, henter vi med det samme.
        if (navigator.permissions && navigator.permissions.query) {
            navigator.permissions.query({ name: 'geolocation' })
                .then(result => {
                    if (result.state === 'granted') {
                        loadWeather();
                    }
                })
                .catch(() => { /* Permissions API ikke understøttet for geolocation */ });
        }
    </script>
</body>
</html>
